# PHP2Shell detection rules.

# Blocking (engine already On):
# On selected rules 88297-88299, 88301, and 88304-88308, replace
# pass,log,auditlog with deny,status:403,log,auditlog on the line containing id.
# Preserve chain and other actions.
# Keep helpers 88295, 88296, 88300, 88302, 88303, 88309 and response rule 88310
# as pass. DetectionOnly suppresses deny; no engine override is included.

# Mark requests declaring multipart/form-data.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)\A[\t ]*multipart/form-data(?:[\t ]*;|[\t ]*$)" \
    "id:88295,phase:1,pass,nolog,t:none,setvar:tx.p2s_multipart=1"

# Mark requests parsed as multipart.
SecRule REQBODY_PROCESSOR "@streq MULTIPART" \
    "id:88296,phase:2,pass,nolog,t:none,setvar:tx.p2s_multipart=1"

# Detect a multipart declaration without an active multipart parser.
SecRule TX:p2s_multipart "@eq 1" \
    "id:88297,phase:2,pass,log,auditlog,t:none,tag:'php2shell',chain,\
    msg:'PHP2Shell guard: multipart body processor is not active'"
    SecRule REQBODY_PROCESSOR "!@streq MULTIPART" "t:none"

# Detect body-parser errors and reported body/file limit violations.
SecRule TX:p2s_multipart "@eq 1" \
    "id:88298,phase:2,pass,log,auditlog,t:none,tag:'php2shell',chain,\
    msg:'PHP2Shell guard: multipart parsing failed or an inspection limit was reached'"
    SecRule REQBODY_ERROR|INBOUND_DATA_ERROR|MULTIPART_FILE_LIMIT_EXCEEDED "!@eq 0" "t:none"

# Flag 1000+ parsed query/body arguments; this is a fixed heuristic.
SecRule TX:p2s_multipart "@eq 1" \
    "id:88299,phase:2,pass,log,auditlog,t:none,tag:'php2shell',chain,\
    msg:'PHP2Shell heuristic: at least 1000 parsed request arguments'"
    SecRule &ARGS "@ge 1000" "t:none"

# Flag binary controls in ordinary multipart fields; exclude TAB, CR and LF.
SecRule ARGS_POST "@rx [\x00-\x08\x0b\x0c\x0e-\x1f\x7f]" \
    "id:88300,phase:2,pass,nolog,t:none,chain"
    SecRule REQBODY_PROCESSOR "@streq MULTIPART" \
        "t:none,setvar:tx.p2s_binary_field=1"

# Log the binary-field flag instead of the field value.
SecRule TX:p2s_binary_field "@eq 1" \
    "id:88301,phase:2,pass,log,auditlog,t:none,tag:'php2shell',\
    msg:'PHP2Shell heuristic: binary control bytes in an ordinary multipart field'"

# Initialize the part count from parsed POST fields.
SecRule &ARGS_POST "@ge 0" \
    "id:88302,phase:2,pass,nolog,t:none,setvar:tx.p2s_part_count=%{MATCHED_VAR}"

# Add parsed file parts to the part count.
SecRule &FILES_NAMES "@ge 0" \
    "id:88303,phase:2,pass,nolog,t:none,setvar:tx.p2s_part_count=+%{MATCHED_VAR}"

# Flag more than 256 text/file parts combined.
SecRule TX:p2s_multipart "@eq 1" \
    "id:88304,phase:2,pass,log,auditlog,t:none,tag:'php2shell',chain,\
    msg:'PHP2Shell heuristic: more than 256 parsed multipart parts (text and files combined)'"
    SecRule TX:p2s_part_count "@gt 256" "t:none"

# Flag more than 1024 parsed multipart header entries.
SecRule TX:p2s_multipart "@eq 1" \
    "id:88305,phase:2,pass,log,auditlog,t:none,tag:'php2shell',chain,\
    msg:'PHP2Shell heuristic: more than 1024 parsed multipart header entries'"
    SecRule &MULTIPART_PART_HEADERS "@gt 1024" "t:none"

# Flag more than 50 parsed file parts.
SecRule TX:p2s_multipart "@eq 1" \
    "id:88306,phase:2,pass,log,auditlog,t:none,tag:'php2shell',chain,\
    msg:'PHP2Shell heuristic: more than 50 uploaded file parts'"
    SecRule &FILES_NAMES "@gt 50" "t:none"

# Flag 17+ consecutive closed bracket segments; this is not exact PHP nesting depth.
SecRule TX:p2s_multipart "@eq 1" \
    "id:88307,phase:2,pass,log,auditlog,t:none,tag:'php2shell',chain,\
    msg:'PHP2Shell heuristic: at least 17 consecutive closed bracket segments in a multipart field name'"
    SecRule ARGS_POST_NAMES|FILES_NAMES "@rx (?:\[[^\]]*\]){17}" "t:none"

# Flag text/file field names longer than 256 bytes.
SecRule TX:p2s_multipart "@eq 1" \
    "id:88308,phase:2,pass,log,auditlog,t:none,tag:'php2shell',chain,\
    msg:'PHP2Shell heuristic: multipart field name exceeds 256 bytes'"
    SecRule ARGS_POST_NAMES|FILES_NAMES "@gt 256" "t:none,t:length"

# Flag raw controls in any cookie value; for PHPSESSID also flag
# percent-encoded controls or values longer than 256 header bytes.
SecRule TX:p2s_multipart "@eq 1" \
    "id:88309,phase:3,pass,nolog,t:none,chain"
    SecRule RESPONSE_HEADERS:Set-Cookie "@rx \A(?:PHPSESSID=(?:[^;\r\n]{257}|[^;\r\n]*%(?i:[01][0-9a-f]|7f))|[^=;\r\n]+=[^;\r\n]*[\x00-\x1f\x7f])" \
        "t:none,setvar:tx.p2s_cookie_anomaly=1"

# Log the cookie flag instead of the cookie value.
SecRule TX:p2s_cookie_anomaly "@eq 1" \
    "id:88310,phase:3,pass,log,auditlog,t:none,tag:'php2shell',\
    msg:'PHP2Shell response heuristic: raw controls in a cookie value, or PHPSESSID contains percent-encoded controls or exceeds 256 header bytes'"
